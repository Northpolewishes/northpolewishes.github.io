<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a3a">
<title>North Pole Wish Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c8102e; --red-d:#8e0b20; --green:#0f6b3a; --green-d:#0a4a28;
  --gold:#f5c542; --gold-d:#c99a1c; --snow:#fffdf7; --cream:#fdf6e3;
  --night1:#0b1a3a; --night2:#1b2d63; --ink:#3a1f14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--snow);
  background:radial-gradient(ellipse at 50% -10%,#3b4f9a 0%,var(--night2) 35%,var(--night1) 75%) fixed;
  min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.lights{position:fixed;top:0;left:0;right:0;height:56px;z-index:3;pointer-events:none}
.lights svg{width:100%;height:100%}
.bulb{animation:twinkle 1.6s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:1;filter:drop-shadow(0 0 6px currentColor)}50%{opacity:.35;filter:none}}
.ground{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:0;pointer-events:none}
.ground svg{width:100%;height:100%}
main{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:70px 18px 150px}
h1.title{
  font-family:'Mountains of Christmas',cursive;font-weight:700;text-align:center;
  font-size:clamp(2.6rem,9vw,4.4rem);line-height:1;margin:.2em 0 .1em;color:var(--gold);
  text-shadow:0 0 18px rgba(245,197,66,.55),0 3px 0 var(--red-d),0 6px 14px rgba(0,0,0,.5);
  letter-spacing:.02em;
}
.sub{text-align:center;font-size:1.1rem;opacity:.9;margin:0 0 18px}
.card{
  background:var(--cream);color:var(--ink);border-radius:22px;padding:22px;margin:18px 0;
  position:relative;box-shadow:0 10px 30px rgba(0,0,0,.45);
  border:6px solid transparent;
  background-image:linear-gradient(var(--cream),var(--cream)),repeating-linear-gradient(45deg,var(--red) 0 14px,#fff 14px 28px);
  background-origin:border-box;background-clip:padding-box,border-box;
}
.card h2{font-family:'Mountains of Christmas',cursive;font-size:2rem;margin:0 0 10px;color:var(--red);text-align:center}
.card p{margin:.4em 0}
.holly{position:absolute;top:-22px;left:-16px;width:62px;height:52px}
/* countdown */
.countdown{display:flex;gap:10px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
.cd{background:linear-gradient(180deg,var(--red),var(--red-d));border:3px solid var(--gold);border-radius:16px;
  min-width:74px;padding:8px 6px 6px;text-align:center;box-shadow:0 6px 0 var(--red-d),0 10px 20px rgba(0,0,0,.4)}
.cd b{display:block;font-size:2.2rem;line-height:1;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.cd span{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}
.cd-label{text-align:center;font-family:'Mountains of Christmas',cursive;font-size:1.6rem;color:#fff;margin-top:6px}
/* forms */
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=tel],input[type=password],input[type=url]{
  width:100%;font:inherit;font-size:1.15rem;padding:13px 14px;border-radius:14px;border:3px solid #e2c98f;
  background:#fff;color:var(--ink);outline:none;
}
input:focus{border-color:var(--green)}
.code-input{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700;font-size:1.6rem!important}
.btn{
  font:inherit;font-weight:700;font-size:1.15rem;border:0;cursor:pointer;border-radius:999px;padding:14px 24px;
  color:#fff;background:linear-gradient(180deg,#e0263f,var(--red));box-shadow:0 5px 0 var(--red-d),0 8px 16px rgba(0,0,0,.3);
  transition:transform .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.green{background:linear-gradient(180deg,#178a4c,var(--green));box-shadow:0 5px 0 var(--green-d),0 8px 16px rgba(0,0,0,.3)}
.btn.gold{background:linear-gradient(180deg,#ffd966,var(--gold-d));color:var(--ink);box-shadow:0 5px 0 #8c6a0e,0 8px 16px rgba(0,0,0,.3)}
.btn.ghost{background:transparent;color:var(--red);box-shadow:none;border:3px solid var(--red);padding:10px 18px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.cane{background:repeating-linear-gradient(-45deg,var(--red) 0 16px,#fff 16px 32px);color:#fff;font-size:1.25rem;padding:16px 24px}.btn.cane span{background:var(--red);border-radius:999px;padding:4px 14px;box-shadow:0 0 0 3px var(--gold)}
.row{display:flex;gap:10px;align-items:center}
.row>input{flex:1}
.stack>*+*{margin-top:12px}
.link{background:none;border:0;color:var(--gold);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.card .link{color:var(--green)}
.err{color:var(--red);font-weight:600;min-height:1.3em;margin-top:8px;text-align:center}
.center{text-align:center}
.hidden{display:none!important}
/* kids */
.kids{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:10px}.kids .kid{flex:0 1 150px}
.kid{border:0;cursor:pointer;font:inherit;border-radius:22px;padding:16px 10px 14px;color:var(--ink);background:var(--cream);
  box-shadow:0 8px 0 #c9b27a,0 12px 22px rgba(0,0,0,.35);transition:transform .1s}
.kid:active{transform:translateY(4px)}
.kid .orn{width:84px;height:96px;margin:0 auto 6px;display:block}
.kid b{font-size:1.35rem}
.parent-door{margin-top:26px;text-align:center}
/* letter */
.paper{
  background:#fffaf0;color:var(--ink);border-radius:8px;padding:26px 22px 22px;margin:18px 0;position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(transparent 0 37px,#d9e3f0 37px 38px);background-position:0 70px;
  border-left:8px double var(--red);
}
.paper .greet{font-family:'Caveat',cursive;font-size:2.1rem;line-height:1.1;margin:0 0 6px;color:var(--red-d)}
.wish-list{list-style:none;padding:0;margin:8px 0 14px}
.wish-list li{font-family:'Caveat',cursive;font-size:1.75rem;line-height:38px;display:flex;align-items:center;gap:10px}
.wish-list li .star{color:var(--gold-d);font-size:1.2rem}
.wish-list li.pending{color:var(--green)}
.wish-list li .x{margin-left:auto;border:0;background:none;color:#a33;font-size:1.4rem;cursor:pointer}
.tip{font-size:.95rem;background:#eaf6ee;color:var(--green-d);border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;gap:8px;align-items:center}
.sign{font-family:'Caveat',cursive;font-size:1.8rem;text-align:right;margin-top:6px}
/* overlay */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 40%,#22377a,#070d24 75%);padding:20px;text-align:center;overflow:auto}
.envelope{width:200px;height:140px;position:relative}
.envelope.fly{animation:fly 1.6s cubic-bezier(.5,-0.3,.7,0) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(1)}30%{transform:translate(-20px,20px) rotate(-8deg) scale(1.05)}100%{transform:translate(60vw,-80vh) rotate(25deg) scale(.2);opacity:0}}
.envelope.seal{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.ov-text{font-family:'Mountains of Christmas',cursive;font-size:2rem;color:var(--gold);margin-top:18px;min-height:2.4em}
.santa-wrap{position:relative;width:min(320px,80vw);animation:rise .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.santa-wrap svg{width:100%;height:auto;display:block}
#santaArm{transform-origin:232px 238px;animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
#santaEyes{transform-origin:160px 132px;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#santaMouth{transform-origin:160px 176px;transition:transform .08s}
.santa-body{animation:jolly .5s ease-in-out infinite alternate}
.talking .santa-body{animation-duration:.25s}
@keyframes jolly{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.bubble{background:#fff;color:var(--ink);border-radius:24px;padding:16px 20px;max-width:420px;font-size:1.25rem;font-weight:600;
  position:relative;margin:18px auto 0;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .5s .5s both}
.bubble:before{content:"";position:absolute;top:-16px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:0;border-bottom-color:#fff;border-bottom-width:18px}
.bubble b{color:var(--red)}
.ov-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}
#burst{position:fixed;inset:0;pointer-events:none;z-index:21}
/* pin pad */
.dots{display:flex;gap:14px;justify-content:center;margin:12px 0 4px}
.dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--red);background:transparent;transition:background .1s}
.dot.on{background:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:14px auto 0}
.pad button{font:inherit;font-size:1.7rem;font-weight:700;padding:14px 0;border-radius:18px;border:0;cursor:pointer;
  background:#fff;color:var(--ink);box-shadow:0 5px 0 #d6c48f}
.pad button:active{transform:translateY(3px);box-shadow:0 2px 0 #d6c48f}
.pad .go{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
/* parent */
.kidsec{margin:18px 0;border-top:3px dashed #e2c98f;padding-top:14px}
.kidsec h3{margin:0;font-size:1.4rem;color:var(--green-d);display:flex;align-items:center;gap:10px}
.kidsec h3 .pill{font-size:.85rem;background:var(--green);color:#fff;border-radius:999px;padding:3px 10px}
.pw{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #eadbb5}
.pw input[type=checkbox]{width:28px;height:28px;accent-color:var(--green);flex:none}
.pw .it{flex:1;font-size:1.1rem}
.pw .dt{font-size:.8rem;color:#8a7a5a;display:block}
.pw.bought .it{text-decoration:line-through;color:#8a7a5a}
.pw .del{border:0;background:none;color:#b33;font-size:1.3rem;cursor:pointer;padding:4px 8px}
.codebox{font-size:2.4rem;font-weight:700;letter-spacing:.3em;text-align:center;color:var(--red);background:#fff;border:3px dashed var(--gold-d);border-radius:16px;padding:10px;margin:10px 0}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:380px;width:100%}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 20px;border-radius:999px;z-index:40;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.spinner{width:42px;height:42px;border:5px solid rgba(255,255,255,.25);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.lang-sw{display:flex;justify-content:center;gap:0;margin:0 auto 6px;width:max-content;border:3px solid var(--gold);border-radius:999px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.lang-sw button{font:inherit;font-weight:700;font-size:1rem;border:0;padding:8px 18px;cursor:pointer;background:rgba(11,26,58,.7);color:#fff}
.lang-sw button.on{background:var(--gold);color:var(--ink)}
.gift-wrap{animation:pop .6s ease-out}
.gift-wrap #giftLid{transition:transform .8s cubic-bezier(.3,1.6,.5,1);transform-origin:100px 60px}
.gift-wrap.open #giftLid{transform:translate(40px,-90px) rotate(35deg)}
.gift-wrap.open{animation:shake .4s 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.reveal-name{font-family:'Mountains of Christmas',cursive;font-weight:700;font-size:clamp(3rem,14vw,5rem);color:#fff;
  text-shadow:0 0 24px rgba(245,197,66,.9),0 4px 0 var(--red-d);animation:pop .7s cubic-bezier(.2,1.5,.4,1) both;line-height:1.1;margin:6px 0}
.sel{font:inherit;font-size:1rem;padding:10px;border-radius:12px;border:3px solid #e2c98f;background:#fff;color:var(--ink);flex:1;min-width:110px}
.overlay .bubble ul{font-weight:500}
a.shop{display:inline-block;font-family:Fredoka,sans-serif;font-size:.85rem;font-weight:600;color:#fff;background:var(--green);border-radius:999px;padding:3px 10px;margin-left:6px;text-decoration:none;vertical-align:middle;line-height:1.4}
.overlay a.shop{font-size:.8rem}
.wish-list li > span:not(.star){flex:1}
@media (prefers-reduced-motion:reduce){.bulb,#santaArm,.santa-body,#santaEyes{animation:none}}
</style>
</head>

  const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, {

  });

  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;

function drawLights(){

  svg.setAttribute('viewBox', `0 0 ${w} 56`);
  const colors = ['#ff3b3b','#ffd93b','#3bff7a','#3bb4ff','#ff7af0'];
  let path = `M0 6`; let bulbs='';
  for(let i=0;i<n;i++){
    const x0 = i*w/n, x1=(i+1)*w/n, mx=(x0+x1)/2;
    path += ` Q${mx} 34 ${x1} 6`;
    const c = colors[i%colors.length];
    bulbs += `<g class="bulb" style="color:${c};animation-delay:${(i%5)*0.3}s"><rect x="${mx-3}" y="18" width="6" height="6" fill="#555"/><ellipse cx="${mx}" cy="33" rx="7" ry="11" fill="${c}"/></g>`;
  }

}

/* ---------- snow ---------- */
(function(){
  const cv = $('#snow'), ctx = cv.getContext('2d'); let flakes=[], W, H;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight;
    const n = Math.min(160, Math.round(W*H/9000));
    flakes = Array.from({length:n}, ()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,s:Math.random()*0.8+0.4,d:Math.random()*Math.PI*2})); }
  function tick(){ ctx.clearRect(0,0,W,H); ctx.fillStyle='rgba(255,255,255,.9)';
    for(const f of flakes){ f.y+=f.s; f.d+=0.01; f.x+=Math.sin(f.d)*0.5;
      if(f.y>H+5){f.y=-5;f.x=Math.random()*W}
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); }
    if(!reduce) requestAnimationFrame(tick); }
  size(); addEventListener('resize', size); tick();
})();

function christmasTarget(){

  if(now.getMonth()===11 && now.getDate()>25) y++;

}

}

let actx = null;

let santaEl = null, silentUrl = null;
function silentWav(){
  if(silentUrl) return silentUrl;
  const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b), w = (o, s) => [...s].forEach((c,i)=>v.setUint8(o+i, c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4, 36+n, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  return silentUrl = URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}

function jingle(){
  if(!actx) return; const t0 = actx.currentTime;
  for(let i=0;i<14;i++){
    const t = t0 + i*0.11 + (i%2?0.02:0);
    [2600,3400,4200].forEach(f=>{
      const o=actx.createOscillator(), g=actx.createGain();

}

    await santaEl.play();
    talk(true);
    const t0 = performance.now();
    (function loop(){ if(!santaEl || santaEl.paused || santaEl.ended){ talk(false); return; }
      const t = (performance.now()-t0)/1000;
      if(mouth) mouth.style.transform = `scaleY(${0.7 + Math.abs(Math.sin(t*11)) * (1.2 + Math.sin(t*3.1))})`;
      requestAnimationFrame(loop); })();
  }catch(e){
    // fallback: device voice
    try{
      const u = new SpeechSynthesisUtterance(req.fallback);
      u.lang = t('speechLang'); u.pitch = 0.5; u.rate = 0.85; talk(true); u.onend = ()=>talk(false); speechSynthesis.speak(u);
    }catch(_){}
  }
}

/* ---------- confetti / star burst ---------- */
function burst(){
  const cv=$('#burst'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#f5c542','#c8102e','#fff','#3bff7a','#ff7af0'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:Math.random()*-14-3,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));
  let f=0; (function tick(){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.a+=0.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c;
      ctx.beginPath(); for(let i=0;i<5;i++){const an=i*1.2566-1.5708; ctx.lineTo(Math.cos(an)*p.r,Math.sin(an)*p.r); ctx.lineTo(Math.cos(an+.628)*p.r*.45,Math.sin(an+.628)*p.r*.45);} ctx.fill(); ctx.restore();});
    if(++f<150) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

// pending-wish list: returns {render, items}
function pendingList(listEl, sendBtn, items){

      li.innerHTML=`<span class="star">✦</span>${esc(p.item || p)}${p.link ? ' 🔗' : ''}<button class="x" aria-label="X">✕</button>`;

// links: http(s) only; bare domains get https://
function cleanLink(v){
  v = String(v||'').trim(); if(!v) return '';
  if(!/^https?:\/\//i.test(v)){ if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$)/i.test(v)) v = 'https://' + v; else return ''; }
  return (v.length > 600 || /[\s<>"]/.test(v)) ? '' : v;
}

// read the form; a link pasted into the wish box moves to the link box
function readWish(){
  let item = $('#wishIn').value.trim(), link = ($('#linkIn')||{}).value || '';
  if(!link && /^(https?:\/\/|www\.)\S+$/i.test(item)){ link = item; try{ item = new URL(cleanLink(item)).hostname.replace(/^www\./,''); }catch(e){} }
  link = cleanLink(link);
  if(!item) return null;
  $('#wishIn').value=''; if($('#linkIn')) $('#linkIn').value='';
  return {item, link};
}

async function adultView(haveData){
  const a = state.adult; if(!a) return adultsView();
  rerender = () => adultView();
  const draft = ($('#wishIn')||{}).value || '';
  if(!haveData){
    try{ const r = await rpc('np_adult_view', {p_code:state.code, p_adult:a.id, p_pin:state.adultPin}); if(r.error){ toast(t('unlockAgain')); return adultPinView(a); } state.adultData = r; }
    catch(e){ return toast(t('network')); }
  }
  const d = state.adultData; state.adultPending = state.adultPending || [];
  const line = Math.floor(Math.random()*5); const voice = adultVoice(a, line);
  const y = scrollY;
  view.innerHTML = `
  <div class="paper">
    <p class="greet">${t('myList')}</p>
    <p style="font-size:.95rem;margin:0 0 6px">${t('myListSub')}</p>
    <p style="font-family:Caveat,cursive;font-size:1.7rem;margin:0">${t('dearSantaAdult')}</p>
    <ul class="wish-list" id="wl">
      ${d.my_wishes.map(w=>`<li><span class="star">★</span><span>${esc(w.item)}${linkBtn(w.link)}</span><button class="x" data-mydel="${w.id}" aria-label="X">✕</button></li>`).join('')}
    </ul>${wishFormHtml(draft)}
    <p class="sign">${t('love',{name:esc(a.name)})}</p>
    <div class="err" id="sendErr"></div>
    <button class="btn cane block" id="sendBtn" disabled><span>${t('sendAdult')}</span></button>
  </div>
  <div class="card">
    <h2 style="font-size:1.6rem">${t('partnerLabel')}</h2>
    <select id="partnerSel" style="width:100%;font:inherit;font-size:1.1rem;padding:12px;border-radius:14px;border:3px solid #e2c98f;background:#fff">
      <option value="">${t('noPartner')}</option>
      ${d.others.map(o=>`<option value="${o.id}" ${o.id===d.partner_id?'selected':''}>${esc(o.name)}</option>`).join('')}
    </select>
    ${d.partner_id && !d.partner_confirmed ? `<p class="tip" style="margin-top:12px">${t('partnerWaiting',{name:esc(d.partner_name||'')})}</p>` : ''}
    ${d.partner_confirmed ? `
      <div class="kidsec">
        <h3>${t('partnerList',{name:esc(d.partner_name)})}</h3>
        <p style="font-size:.9rem;color:#7a6a4a;margin:4px 0">${t('partnerListSub',{name:esc(d.partner_name)})}</p>
        ${d.partner_wishes.length ? d.partner_wishes.map(w=>`
          <div class="pw ${w.bought?'bought':''}"><input type="checkbox" data-w="${w.id}" ${w.bought?'checked':''} aria-label="✓">
          <span class="it">${esc(w.item)}${linkBtn(w.link, t('shopIt'))}<span class="dt">${t('asked',{d:fmtDay(w.created_at)})}</span></span></div>`).join('')
          : `<p style="color:#8a7a5a">${t('noAdultWishes')}</p>`}
      </div>` : ''}
    <div class="stack" style="margin-top:18px"><button class="btn block" id="lock">${t('lock')}</button></div>
  </div>`;
  if(haveData) scrollTo({top:0,behavior:'smooth'}); else scrollTo(0,y);
  const sendBtn = $('#sendBtn');
  const renderPending = pendingList($('#wl'), sendBtn, state.adultPending);
  $('#wishForm').onsubmit = e => { e.preventDefault(); if(state.adultPending.length>=20) return; const w = readWish();
    if(!w) return; state.adultPending.push(w); renderPending(); $('#wishIn').focus(); };
  view.querySelectorAll('[data-mydel]').forEach(b => b.onclick = async () => {
    await rpc('np_adult_delete_wish', {p_code:state.code, p_adult:a.id, p_pin:state.adultPin, p_wish:b.dataset.mydel}); adultView(); });
  sendBtn.onclick = async () => {
    const extra = readWish(); if(extra) state.adultPending.push(extra);
    if(!state.adultPending.length) return;
    unlockAudio(); jingle(); sendBtn.disabled = true;
    fetchVoice(voice).catch(()=>{});
    try{
      const r = await rpc('np_adult_add_items', {p_code:state.code, p_adult:a.id, p_pin:state.adultPin, p_items:state.adultPending.map(p => typeof p === 'string' ? {item:p, link:''} : p)});
      if(r.error) throw new Error(t('unlockAgain'));
      state.adultPending.length = 0;
      santaScene({ bubble: adultLine(line, a.name, true), voice, back: ()=>adultView() });
    }catch(e){ $('#sendErr').textContent = e.message; sendBtn.disabled=false; }
  };
  $('#partnerSel').onchange = async e => {
    const r = await rpc('np_adult_set_partner', {p_code:state.code, p_adult:a.id, p_pin:state.adultPin, p_partner:e.target.value || null});
    toast(r.error ? t('somethingWrong') : t('saved')); adultView();
  };
  view.querySelectorAll('input[type=checkbox][data-w]').forEach(cb => cb.onchange = async () => {
    cb.closest('.pw').classList.toggle('bought', cb.checked);
    try{ const r = await rpc('np_adult_set_bought', {p_code:state.code, p_adult:a.id, p_pin:state.adultPin, p_wish:cb.dataset.w, p_bought:cb.checked}); if(r.error) throw 0; }
    catch(e){ toast(t('couldNotSave')); cb.checked=!cb.checked; cb.closest('.pw').classList.toggle('bought', cb.checked); }
  });
  $('#lock').onclick = () => { state.adult=null; state.adultPin=null; state.adultData=null; state.adultPending=[]; adultsView(); };
}

const GIFT = `<svg viewBox="0 0 200 200" width="190" height="190"><g id="giftLid"><rect x="22" y="50" width="156" height="34" rx="6" fill="#e0263f"/><rect x="88" y="50" width="24" height="34" fill="#f5c542"/>

async function revealScene(data){
  rerender = () => {};
  const my = ++sceneId;
  const ov = $('#overlay'); ov.classList.remove('hidden');
  ov.innerHTML = `<div class="gift-wrap" id="gift">${GIFT}</div><div class="ov-text">${t('ssUnwrap')}</div>`;
  jingle();
  let r;
  try{ r = await rpc('ss_reveal', {p_code:state.ssCode, p_member:state.ssMember.id, p_pin:state.ssPin}); }catch(e){ r = {error:'network'}; }
  setTimeout(()=>{
    if(my !== sceneId) return;
    if(r.error){ ov.classList.add('hidden'); ov.innerHTML=''; toast(r.error==='network'?t('network'):t('unlockAgain')); return memberView(); }
    $('#gift').classList.add('open');
    setTimeout(()=>{
      if(my !== sceneId) return;
      ov.innerHTML = `<div class="ov-text" style="margin-top:0">${t('ssYouGot')}</div>
        <div class="reveal-name">${esc(r.name)}</div>
        <div class="bubble" style="text-align:left">
          <b>${t('ssTheirList')}</b>
          ${r.wishes.length ? `<ul style="margin:8px 0 0;padding-left:20px">${r.wishes.map(w=>`<li>${esc(w.item)}${linkBtn(w.link, t('shopIt'))}</li>`).join('')}</ul>` : `<p style="margin:8px 0 0">${t('ssNoList')}</p>`}
          ${data.budget || data.exchange_date ? `<p style="margin:10px 0 0;color:#7a6a4a">${data.budget ? t('ssBudgetLabel',{b:esc(data.budget)}) : ''}${data.budget && data.exchange_date ? ' · ' : ''}${data.exchange_date ? t('ssDateLabel',{d:fmtDay(data.exchange_date)}) : ''}</p>` : ''}
        </div>
        <p class="ov-text" style="font-size:1.4rem">${t('ssShh')}</p>
        <div class="ov-actions"><button class="btn green" id="done">${t('back')}</button></div>`;
      burst();
      $('#done').onclick = ()=>{ ov.classList.add('hidden'); ov.innerHTML=''; memberView(); };
    }, 900);
  }, 1400);
}

/* ----- organizer ----- */
function orgPinView(){
  rerender = orgPinView;
  pinPad({ title:t('ssOrgTools'), sub:t('enterPin'), back:groupView, onSubmit: async pin => {
    const r = await rpc('ss_org_view', {p_code:state.ssCode, p_pin:pin});
    if(r.error) return r.error;
    state.orgPin = pin; orgView(r);
  }});
}

async function orgView(data){
  rerender = () => orgView();
  if(!state.orgPin) return orgPinView();
  if(!data){
    try{ data = await rpc('ss_org_view', {p_code:state.ssCode, p_pin:state.orgPin}); if(data.error){ toast(t('unlockAgain')); return orgPinView(); } }
    catch(e){ return toast(t('network')); }
  }
  const y = scrollY;
  const mem = data.members, revealed = mem.filter(m=>m.revealed).length;
  const opts = `<option value="">${t('orgPick')}</option>` + mem.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');
  const rules = kind => data.exclusions.filter(e=>e.kind===kind).map(e=>`<div class="pw"><span class="it">${esc(e.a)} ${kind==='couple'?t('orgAnd'):'→'} ${esc(e.b)}</span><button class="del" data-rmx="${e.id}" aria-label="X">✕</button></div>`).join('');
  const sel = id => `<select id="${id}" class="sel">${opts}</select>`;
  view.innerHTML = `
  <div class="card">${HOLLY}
    <h2>${t('ssOrgTools')}</h2>
    ${groupHeader(data)}
    <p class="center" style="font-size:.9rem;color:#7a6a4a">${t('orgBlind')}</p>
    <div class="stack" style="margin:10px 0">
      ${data.drawn ? `<p class="tip">${t('orgDrawn',{r:revealed,n:mem.length})}</p>
        ${revealed===0 ? `<button class="btn ghost block" id="draw">${t('orgRedraw')}</button>` : ''}
        <button class="btn block" id="newRound">${t('orgNewRound')}</button>`
      : `<button class="btn cane block" id="draw"><span>${t('orgDraw')}</span></button>`}
      <button class="btn gold block" id="share">${t('ssShareLink')} (${esc(state.ssCode)})</button>
    </div>
    <div class="err" id="orgErr"></div>
    <div class="kidsec"><h3>${t('orgPlayers')} <span class="pill">${mem.length}</span></h3>
      ${mem.map(m=>`<div class="pw"><span class="it">${esc(m.name)}<span class="dt">${t('orgWishCount',{n:m.wish_count})}${data.drawn ? ' · ' + (m.revealed ? '✓ '+t('orgOpened') : t('orgNotOpened')) : ''}</span></span>
        <button class="link" data-rpin="${m.id}" data-name="${esc(m.name)}" style="font-size:.9rem">${t('resetPin')}</button>
        ${data.drawn ? '' : `<button class="del" data-rm="${m.id}" data-name="${esc(m.name)}" aria-label="X">✕</button>`}</div>`).join('')}
    </div>
    <div class="kidsec"><h3>${t('orgRules')}</h3>
      <p style="font-weight:600;margin:10px 0 4px">${t('orgCouples')}</p>
      ${rules('couple')}
      <div class="row" style="flex-wrap:wrap">${sel('cA')}<span>${t('orgAnd')}</span>${sel('cB')}<button class="btn green" id="addCouple">${t('orgAdd')}</button></div>
      <p style="font-weight:600;margin:14px 0 4px">${t('orgLastYear')}</p>
      ${rules('lastyear')}
      <div class="row" style="flex-wrap:wrap">${sel('lA')}<span>${t('orgGaveTo')}</span>${sel('lB')}<button class="btn green" id="addLast">${t('orgAdd')}</button></div>
    </div>
    <div class="kidsec"><h3>${t('orgSettings')}</h3>
      <label>${t('ssBudget')}</label><input type="text" id="sBudget" maxlength="30" value="${esc(data.budget||'')}">
      <label>${t('ssDate')}</label><input type="date" id="sDate" value="${esc(data.exchange_date||'')}" class="sel" style="width:100%">
      <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="sLock" ${data.signups_locked?'checked':''} ${data.drawn?'disabled':''} style="width:24px;height:24px"> ${t('orgLockSignups')}</label>
      <button class="btn green" id="saveSettings">${t('save')}</button>
    </div>
    <div class="stack" style="margin-top:18px"><button class="btn block" id="lock">${t('lock')}</button></div>
  </div>`;
  scrollTo(0, data._top ? 0 : y);
  const org = (fn, args) => rpc(fn, Object.assign({p_code:state.ssCode, p_pin:state.orgPin}, args));
  const errMsg = e => ({too_few:t('errTooFew'), impossible:t('errImpossible'), already_revealed:t('errAlreadyRevealed'), drawn:t('errDrawn'), locked:t('locked'), bad_pin:t('unlockAgain')}[e] || t('somethingWrong'));
  const drawBtn = $('#draw');
  if(drawBtn) drawBtn.onclick = () => confirmBox(t('orgDrawConfirm'), async () => {
    const r = await org('ss_org_draw', {}); if(r.error){ $('#orgErr').textContent = errMsg(r.error); return; }
    jingle(); burst(); toast(t('drawnToast')); orgView(); });
  const nr = $('#newRound'); if(nr) nr.onclick = () => confirmBox(t('orgNewRoundConfirm'), async () => {
    const r = await org('ss_org_new_round', {}); if(r.error) return toast(errMsg(r.error)); orgView(); });
  $('#share').onclick = () => shareFamily(state.ssCode, 'ssShareText');
  view.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => confirmBox(t('ssRemoveConfirm',{name:b.dataset.name}), async () => {
    const r = await org('ss_org_remove_member', {p_member:b.dataset.rm}); if(r.error) toast(errMsg(r.error)); orgView(); }));
  view.querySelectorAll('[data-rpin]').forEach(b => b.onclick = () => pinPrompt(t('resetPinFor',{name:b.dataset.name}), async v => {
    const r = await org('ss_org_reset_pin', {p_member:b.dataset.rpin, p_new_pin:v}); toast(r.error ? errMsg(r.error) : t('pinChanged')); }));
  view.querySelectorAll('[data-rmx]').forEach(b => b.onclick = async () => { await org('ss_org_remove_exclusion', {p_excl:b.dataset.rmx}); orgView(); });
  const addRule = (a, b, kind) => async () => { const A=$('#'+a).value, B=$('#'+b).value; if(!A || !B || A===B) return;
    const r = await org('ss_org_add_exclusion', {p_a:A, p_b:B, p_kind:kind}); if(r.error) toast(errMsg(r.error)); orgView(); };
  $('#addCouple').onclick = addRule('cA','cB','couple');
  $('#addLast').onclick = addRule('lA','lB','lastyear');
  $('#saveSettings').onclick = async () => {
    const r = await org('ss_org_update', {p_budget:$('#sBudget').value, p_date:$('#sDate').value || null, p_locked:$('#sLock').checked});
    toast(r.error ? errMsg(r.error) : t('saved')); orgView(); };
  $('#lock').onclick = () => { state.orgPin = null; groupView(); };
}

/* ---------- start ---------- */
function readHash(){
  // link formats: #ABC123 or #ABC123-es / #ABC123-en
  const h = (location.hash||'').replace('#','').trim();
  const m = /^([A-Za-z0-9]{6})(?:-(en|es))?$/.exec(h);
  if(!m) return null;
  if(m[2]){ LANG = m[2]; store.set('np_lang', LANG); }
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  return m[1].toUpperCase();
}
async function boot(code){
  sceneId++; const ov = $('#overlay'); if(ov){ ov.classList.add('hidden'); ov.innerHTML=''; }
  applyStatic();
  if(code && await openCode(code)) return;
  if(state.code && await openCode(state.code)) return;
  const s = store.get('np_ss'); if(s && await openCode(s)) return;
  homeView();
}
(function start(){
  const code = readHash();
  document.querySelectorAll('#langSw button').forEach(b => b.onclick = () => setLang(b.dataset.l));
  addEventListener('hashchange', () => { const c = readHash(); if(c) boot(c); });
  boot(code);
})();
</script>
